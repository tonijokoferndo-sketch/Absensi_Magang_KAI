<!DOCTYPE html>

<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0F4C81"
    >

    <title>
        Absensi Magang KAI
    </title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =====================================
         PWA - WEB APP MANIFEST
    ====================================== -->

    <link
        rel="manifest"
        href="manifest.json"
    >


    <!-- =====================================
         PWA - ANDROID / CHROME
    ====================================== -->

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >


    <!-- =====================================
         PWA - iOS / SAFARI
    ====================================== -->

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Absensi KAI"
    >

    <link
        rel="apple-touch-icon"
        href="assets/icons/apple-touch-icon.png"
    >


    <!-- =====================================
         FAVICON
    ====================================== -->

    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="assets/icons/favicon-32.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="assets/icons/favicon-16.png"
    >

</head>


<body>


    <!-- =====================================
         APP
    ====================================== -->

    <div id="app">


        <!-- =================================
             LOGIN
        ================================== -->

        <section
            id="loginPage"
            class="page"
        >

            <div class="card">

                <div class="logo">
                    KAI
                </div>


                <h1>
                    Absensi Magang
                </h1>


                <p class="subtitle">
                    PT KAI Divre II Sumbar
                </p>


                <form
                    id="loginForm"
                >

                    <div class="form-group">

                        <label>
                            NIM
                        </label>

                        <input
                            type="text"
                            id="loginNim"
                            placeholder="Masukkan NIM"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Masukkan password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Login
                    </button>


                </form>


                <p
                    id="loginMessage"
                    class="message"
                ></p>


                <div class="switch">

                    Belum punya akun?

                    <button
                        type="button"
                        id="showRegister"
                    >
                        Daftar
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================
             REGISTER
        ================================== -->

        <section
            id="registerPage"
            class="page hidden"
        >

            <div class="card">

                <div class="logo">
                    KAI
                </div>


                <h1>
                    Registrasi
                </h1>


                <p class="subtitle">
                    Buat akun baru
                </p>


                <form
                    id="registerForm"
                >


                    <div class="form-group">

                        <label>
                            NIM
                        </label>

                        <input
                            type="text"
                            id="registerNim"
                            placeholder="Masukkan NIM"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Nama Lengkap
                        </label>

                        <input
                            type="text"
                            id="registerNama"
                            placeholder="Masukkan nama"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Masukkan email"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Divisi
                        </label>

                        <input
                            type="text"
                            id="registerDivisi"
                            placeholder="Contoh: IT"
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Buat password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Daftar
                    </button>


                </form>


                <p
                    id="registerMessage"
                    class="message"
                ></p>


                <div class="switch">

                    Sudah punya akun?

                    <button
                        type="button"
                        id="showLogin"
                    >
                        Login
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================
             DASHBOARD
        ================================== -->

        <section
            id="dashboardPage"
            class="page hidden"
        >

            <div class="dashboard">

                <header class="dashboard-header">

                    <div>

                        <h2>
                            Absensi Magang KAI
                        </h2>

                        <p id="welcomeText">
                            Selamat datang
                        </p>

                    </div>


                    <button
                        id="logoutButton"
                        class="btn-logout"
                    >
                        Logout
                    </button>

                </header>


                <div
                    id="dashboardContent"
                    class="dashboard-content"
                >

                </div>

            </div>

        </section>


    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script
        src="js/config.js"
    ></script>

    <script
        src="js/api.js"
    ></script>

    <script
        src="js/auth.js"
    ></script>

   <script
    src="assets/qrcode.min.js"
></script>

<script
    src="assets/html5-qrcode.min.js"
></script>

    <script
        src="js/dashboard.js"
    ></script>

    <script
        src="js/scanner.js"
    ></script>

    <script
        src="js/app.js"
    ></script>


    <!-- =====================================
         PWA - REGISTER SERVICE WORKER
    ====================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                // "./service-worker.js" (relatif) supaya
                // tetap benar walau di-host di subfolder
                // GitHub Pages (mis. username.github.io/repo/)
                navigator.serviceWorker
                    .register("./service-worker.js")
                    .then((reg) => {

                        console.log(
                            "[PWA] Service worker terdaftar:",
                            reg.scope
                        );

                    })
                    .catch((error) => {

                        console.error(
                            "[PWA] Gagal mendaftarkan service worker:",
                            error
                        );

                    });

            });

        }

    </script>

</body>

</html>
